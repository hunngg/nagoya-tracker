<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名古屋旅遊記帳</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d0d1f'/%3E%3C!-- top cap --%3E%3Crect x='10' y='14' width='80' height='10' rx='3' fill='%23E8603C'/%3E%3Crect x='16' y='10' width='68' height='7' rx='2' fill='%23E8603C'/%3E%3C!-- second beam --%3E%3Crect x='18' y='30' width='64' height='8' rx='2' fill='%23E8603C'/%3E%3C!-- left pillar --%3E%3Crect x='24' y='24' width='10' height='62' rx='2' fill='%23c0c8e0'/%3E%3C!-- right pillar --%3E%3Crect x='66' y='24' width='10' height='62' rx='2' fill='%23c0c8e0'/%3E%3C!-- left leg brace --%3E%3Crect x='20' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(-15 25 83)'/%3E%3Crect x='34' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(15 39 83)'/%3E%3C!-- right leg brace --%3E%3Crect x='56' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(-15 61 83)'/%3E%3Crect x='70' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(15 75 83)'/%3E%3C!-- crossbar connector --%3E%3Crect x='34' y='45' width='32' height='5' rx='1.5' fill='%23f0c040'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d0d1f'/%3E%3Crect x='10' y='14' width='80' height='10' rx='3' fill='%23E8603C'/%3E%3Crect x='16' y='10' width='68' height='7' rx='2' fill='%23E8603C'/%3E%3Crect x='18' y='30' width='64' height='8' rx='2' fill='%23E8603C'/%3E%3Crect x='24' y='24' width='10' height='62' rx='2' fill='%23c0c8e0'/%3E%3Crect x='66' y='24' width='10' height='62' rx='2' fill='%23c0c8e0'/%3E%3Crect x='20' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(-15 25 83)'/%3E%3Crect x='34' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(15 39 83)'/%3E%3Crect x='56' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(-15 61 83)'/%3E%3Crect x='70' y='80' width='10' height='6' rx='1' fill='%23c0c8e0' transform='rotate(15 75 83)'/%3E%3Crect x='34' y='45' width='32' height='5' rx='1.5' fill='%23f0c040'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="名古屋記帳">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d1f">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d1f;
    color: #e8e8ff;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1a1a3e 0%, #0d0d1f 100%);
    border-bottom: 1px solid #2a2a5a;
    padding: 28px 24px 20px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; top: -30px; right: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, #3040c040 0%, transparent 70%);
  }
  .header::after {
    content: '';
    position: absolute; bottom: -20px; left: 60px;
    width: 80px; height: 80px; border-radius: 50%;
    background: radial-gradient(circle, #c0304040 0%, transparent 70%);
  }
  .header-title { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .header-title .emoji { font-size: 28px; }
  .header-title h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #fff; }
  .header-subtitle { font-size: 11px; color: #8080c0; letter-spacing: 1px; }
  .currency-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .currency-bar label { font-size: 11px; color: #7070b0; letter-spacing: 1px; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid #2a2a5a; background: #10102a; }
  .tab-btn {
    flex: 1; padding: 14px 0;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    color: #6060a0; font-size: 13px;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .tab-btn.active { border-bottom-color: #f0c040; color: #f0c040; font-weight: 700; }

  /* Content */
  .content { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* Form */
  .form-section { padding-top: 24px; display: flex; flex-direction: column; gap: 16px; }
  .field label {
    display: block; font-size: 11px; letter-spacing: 2px;
    color: #7070b0; text-transform: uppercase; margin-bottom: 6px;
  }
  .input-base {
    background: #0f0f23; border: 1px solid #2e2e5e;
    border-radius: 8px; color: #e8e8ff;
    padding: 10px 14px; font-size: 15px;
    width: 100%; outline: none;
    font-family: inherit;
  }
  .input-base:focus { border-color: #5050a0; }

  /* Chip buttons (category / payment) */
  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px; border-radius: 20px;
    border: 1.5px solid #2e2e5e;
    background: transparent; color: #8080b0;
    font-size: 13px; transition: all 0.15s;
  }
  .chip.active-cat-吃喝 { border-color: #E8603C; background: #E8603C22; color: #E8603C; }
  .chip.active-cat-住宿 { border-color: #3C7BE8; background: #3C7BE822; color: #3C7BE8; }
  .chip.active-cat-交通 { border-color: #3CC87B; background: #3CC87B22; color: #3CC87B; }
  .chip.active-cat-送禮 { border-color: #C83CE8; background: #C83CE822; color: #C83CE8; }
  .chip.active-cat-其他 { border-color: #E8C03C; background: #E8C03C22; color: #E8C03C; }

  .pay-group { display: flex; gap: 8px; }
  .pay-btn {
    flex: 1; padding: 10px 0; border-radius: 8px;
    border: 1.5px solid #2e2e5e;
    background: transparent; color: #6060a0;
    font-size: 13px; transition: all 0.15s;
  }
  .pay-btn.active { border-color: #a0c0ff; background: #a0c0ff18; color: #a0c0ff; }

  /* Amount row */
  .amount-row { display: flex; gap: 8px; }
  .amount-wrap { position: relative; flex: 1; }
  .amount-prefix {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    color: #f0c040; font-weight: 700; pointer-events: none;
  }
  .amount-input { padding-left: 30px !important; }
  .calc-toggle-btn {
    background: #1a1a4a; border: 1.5px solid #2e2e5e;
    border-radius: 8px; color: #7070b0;
    font-size: 18px; width: 44px; flex-shrink: 0;
    transition: all 0.15s;
  }
  .calc-toggle-btn.open { background: #2a2a6a; border-color: #a0a0ff; color: #c0c0ff; }
  .twd-preview { font-size: 12px; color: #80c080; margin-top: 6px; padding-left: 2px; }

  /* Calculator */
  .calc-panel {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    z-index: 100; background: #12122e;
    border: 1.5px solid #3030a0; border-radius: 14px;
    padding: 14px; box-shadow: 0 8px 40px #00000090;
  }
  .calc-display {
    background: #0a0a1e; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px; min-height: 64px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
    border: 1px solid #2020a0;
  }
  .calc-expr { font-size: 12px; color: #5050a0; word-break: break-all; text-align: right; min-height: 18px; }
  .calc-result { font-size: 22px; font-weight: 700; font-family: monospace; color: #e8e8ff; margin-top: 2px; }
  .calc-result.ok { color: #80ff80; }
  .calc-result.err { color: #ff6060; }
  .calc-keys { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 6px; }
  .calc-key {
    padding: 12px 0; border-radius: 8px; border: none;
    font-size: 16px; font-family: monospace; transition: background 0.1s;
    background: #1e1e40; color: #e8e8ff;
  }
  .calc-key.op { background: #1a2a4a; color: #80b0ff; font-weight: 700; }
  .calc-key.del { background: #2a1010; color: #ff8080; }
  .calc-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .calc-equals {
    padding: 13px 0; border-radius: 8px; border: none;
    font-size: 18px; font-weight: 700;
    background: linear-gradient(135deg, #2040a0, #3060d0); color: #fff;
  }
  .calc-apply {
    padding: 13px 0; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 700; letter-spacing: 1px;
    background: #1a1a2e; color: #4040a0; transition: all 0.2s;
  }
  .calc-apply.ready { background: linear-gradient(135deg, #205020, #30a030); color: #fff; cursor: pointer; }

  /* Save btn */
  .save-btn {
    background: linear-gradient(135deg, #c0400a, #e07020);
    border: none; border-radius: 10px; color: #fff;
    font-size: 15px; padding: 14px; font-weight: 700;
    letter-spacing: 2px; transition: all 0.3s; width: 100%;
  }
  .save-btn.saved { background: #2a5a2a; }
  .cancel-btn {
    background: none; border: 1px solid #4040a0; border-radius: 10px;
    color: #8080c0; font-size: 13px; padding: 10px; width: 100%;
  }
  .edit-notice {
    background: #2a1a00; border: 1px solid #c08030; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: #f0a050;
  }

  /* List */
  .list-section { padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; color: #5050a0; padding: 60px 0; font-size: 14px; }
  .empty .emoji { font-size: 40px; margin-bottom: 12px; }
  .record-card {
    background: #14142e; border-radius: 10px;
    padding: 12px 14px; display: flex;
    justify-content: space-between; align-items: flex-start; gap: 10px;
    border: 1px solid #2a2a4a;
    border-left-width: 3px;
  }
  .record-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .record-date { font-size: 11px; color: #6060a0; }
  .record-cat { border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .record-pay { font-size: 11px; color: #6060a0; background: #20204a; border-radius: 8px; padding: 1px 7px; }
  .record-note { font-size: 12px; color: #8080b0; margin-bottom: 2px; }
  .record-amount { font-size: 16px; font-weight: 700; color: #f0c040; font-family: monospace; text-align: right; }
  .record-orig { font-size: 11px; color: #5050a0; text-align: right; }
  .record-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .btn-edit { background: #20205a; border: none; border-radius: 6px; color: #8090d0; font-size: 11px; padding: 4px 8px; }
  .btn-del  { background: #3a1010; border: none; border-radius: 6px; color: #c06060; font-size: 11px; padding: 4px 8px; }

  /* Summary */
  .summary-section { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #14142e; border: 1px solid #2a2a5a; border-radius: 14px; padding: 18px; }
  .card-title { font-size: 12px; color: #7070b0; letter-spacing: 2px; margin-bottom: 14px; }
  .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .grand-label { font-size: 11px; color: #7070b0; letter-spacing: 2px; margin-bottom: 4px; text-align: center; }
  .grand-amount { font-size: 28px; font-weight: 700; color: #f0c040; font-family: monospace; text-align: center; }
  .cat-row { margin-bottom: 12px; }
  .cat-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .cat-name { font-size: 13px; }
  .cat-val { font-family: monospace; color: #e8e8ff; font-size: 14px; font-weight: 700; }
  .cat-pct { color: #6060a0; font-size: 11px; margin-left: 8px; }
  .cat-bar-bg { height: 5px; background: #20204a; border-radius: 3px; overflow: hidden; }
  .cat-bar { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pay-card { background: #0f0f23; border-radius: 10px; padding: 14px; }
  .pay-card-label { font-size: 11px; color: #7070b0; margin-bottom: 6px; }
  .pay-card-val { font-family: monospace; font-size: 18px; font-weight: 700; }
  .pay-card-pct { font-size: 10px; color: #4040a0; margin-top: 4px; }
  .ic-note { margin-top: 12px; font-size: 11px; color: #4040a0; line-height: 1.6; padding: 8px 10px; background: #0a0a1a; border-radius: 8px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">
    <span class="emoji">⛩️</span>
    <div>
      <h1>名古屋旅遊記帳</h1>
      <div class="header-subtitle">NAGOYA TRAVEL EXPENSE TRACKER</div>
    </div>
  </div>
  <div class="currency-bar">
    <label>幣別</label>
    <select id="currencySelect" class="input-base" style="width:auto;padding:6px 10px;font-size:13px">
      <option value="JPY">🇯🇵 日元（¥）</option>
      <option value="TWD">🇹🇼 新台幣（NT$）</option>
    </select>
    <span id="rateLabel" class="hidden" style="font-size:11px;color:#7070b0">匯率</span>
    <input id="rateInput" type="number" value="0.20" step="0.01"
      class="input-base hidden" style="width:80px;padding:6px 10px;font-size:13px">
    <span id="rateUnit" class="hidden" style="font-size:11px;color:#7070b0">¥1 = NT$</span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" data-tab="record">✏️ 記帳</button>
  <button class="tab-btn" data-tab="list">📋 明細</button>
  <button class="tab-btn" data-tab="summary">📊 統計</button>
</div>

<div class="content">

  <!-- ── RECORD TAB ── -->
  <div id="tab-record" class="form-section">
    <div id="editNotice" class="edit-notice hidden">✏️ 編輯模式 — 修改後請點「更新」</div>

    <!-- Date -->
    <div class="field">
      <label>日期</label>
      <input type="date" id="formDate" class="input-base">
    </div>

    <!-- Category -->
    <div class="field">
      <label>花費分類</label>
      <div class="chip-group" id="catGroup">
        <button class="chip" data-cat="吃喝">🍜 吃喝</button>
        <button class="chip" data-cat="住宿">🏨 住宿</button>
        <button class="chip" data-cat="交通">🚅 交通</button>
        <button class="chip" data-cat="送禮">🎁 送禮</button>
        <button class="chip" data-cat="其他">📦 其他</button>
      </div>
    </div>

    <!-- Payment -->
    <div class="field">
      <label>付款方式</label>
      <div class="pay-group" id="payGroup">
        <button class="pay-btn" data-pay="現金">💴 現金</button>
        <button class="pay-btn" data-pay="信用卡">💳 信用卡</button>
        <button class="pay-btn" data-pay="IC卡">🎴 IC卡</button>
      </div>
    </div>

    <!-- Amount + Calculator -->
    <div class="field" style="position:relative" id="amountField">
      <label>金額（¥ 日元）</label>
      <div class="amount-row">
        <div class="amount-wrap">
          <span class="amount-prefix">¥</span>
          <input type="number" id="formAmount" class="input-base amount-input" placeholder="0">
        </div>
        <button class="calc-toggle-btn" id="calcToggleBtn" title="開啟計算機">🧮</button>
      </div>
      <div id="twdPreview" class="twd-preview hidden"></div>

      <!-- Calculator Panel -->
      <div class="calc-panel hidden" id="calcPanel">
        <div class="calc-display">
          <div class="calc-expr" id="calcExpr">0</div>
          <div class="calc-result" id="calcResult"></div>
        </div>
        <div class="calc-keys">
          <button class="calc-key del" data-key="C">C</button>
          <button class="calc-key del" data-key="⌫">⌫</button>
          <button class="calc-key op" data-key="(">(</button>
          <button class="calc-key op" data-key=")">)</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="7">7</button>
          <button class="calc-key" data-key="8">8</button>
          <button class="calc-key" data-key="9">9</button>
          <button class="calc-key op" data-key="/">÷</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="4">4</button>
          <button class="calc-key" data-key="5">5</button>
          <button class="calc-key" data-key="6">6</button>
          <button class="calc-key op" data-key="*">×</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="1">1</button>
          <button class="calc-key" data-key="2">2</button>
          <button class="calc-key" data-key="3">3</button>
          <button class="calc-key op" data-key="-">−</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="0">0</button>
          <button class="calc-key" data-key=".">.</button>
          <button class="calc-key op" data-key="%">%</button>
          <button class="calc-key op" data-key="+">+</button>
        </div>
        <div class="calc-bottom">
          <button class="calc-equals" id="calcEqualsBtn">=</button>
          <button class="calc-apply" id="calcApplyBtn">套用金額</button>
        </div>
      </div>
    </div>

    <!-- Note -->
    <div class="field">
      <label>備註</label>
      <input type="text" id="formNote" class="input-base" placeholder="可選填…">
    </div>

    <!-- Save -->
    <button class="save-btn" id="saveBtn">＋ 儲存記錄</button>
    <button class="cancel-btn hidden" id="cancelEditBtn">取消編輯</button>
  </div>

  <!-- ── LIST TAB ── -->
  <div id="tab-list" class="hidden">
    <div class="list-section" id="listContainer">
      <div class="empty"><div class="emoji">🗒️</div>尚無記帳資料</div>
    </div>
  </div>

  <!-- ── SUMMARY TAB ── -->
  <div id="tab-summary" class="hidden">
    <div class="summary-section">
      <!-- Pie + Total -->
      <div class="card pie-wrap">
        <svg id="pieChart" viewBox="0 0 200 200" width="200" height="200">
          <text x="100" y="104" text-anchor="middle" fill="#888" font-size="12" font-family="'Noto Sans TC',sans-serif">尚無資料</text>
        </svg>
        <div>
          <div class="grand-label">總花費</div>
          <div class="grand-amount" id="grandTotal">¥0</div>
        </div>
      </div>

      <!-- Category breakdown -->
      <div class="card">
        <div class="card-title">花費分類統計</div>
        <div id="catBreakdown"></div>
      </div>

      <!-- Payment breakdown -->
      <div class="card">
        <div class="card-title">付款方式統計</div>
        <div class="pay-grid" id="payBreakdown"></div>
        <div class="ic-note">ℹ️ IC卡為預儲現金扣款，不列入付款方式統計</div>
      </div>
    </div>
  </div>

</div><!-- /content -->

<script>
const CATEGORIES = ["吃喝","住宿","交通","送禮","其他"];
const CAT_COLORS  = { 吃喝:"#E8603C", 住宿:"#3C7BE8", 交通:"#3CC87B", 送禮:"#C83CE8", 其他:"#E8C03C" };
const CAT_ICONS   = { 吃喝:"🍜", 住宿:"🏨", 交通:"🚅", 送禮:"🎁", 其他:"📦" };

// ── State ──────────────────────────────────────────────
let records   = [];
let currency  = "JPY";
let rate      = 0.20;
let editId    = null;
let formCat   = "吃喝";
let formPay   = "現金";
let calcExpr  = "";
let calcRes   = null;
let calcErr   = false;
let calcOpen  = false;

const today = () => new Date().toISOString().slice(0,10);

// ── DOM refs ───────────────────────────────────────────
const $ = id => document.getElementById(id);
const formDate   = $("formDate");
const formAmount = $("formAmount");
const formNote   = $("formNote");
const saveBtn    = $("saveBtn");
const cancelBtn  = $("cancelEditBtn");
const editNotice = $("editNotice");
const twdPreview = $("twdPreview");
const calcPanel  = $("calcPanel");
const calcToggle = $("calcToggleBtn");
const calcExprEl = $("calcExpr");
const calcResEl  = $("calcResult");
const calcApply  = $("calcApplyBtn");

// ── Init ───────────────────────────────────────────────
formDate.value = today();
selectCat("吃喝");
selectPay("現金");

// ── Tabs ───────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["record","list","summary"].forEach(t => $("tab-"+t).classList.add("hidden"));
    $("tab-"+btn.dataset.tab).classList.remove("hidden");
    if (btn.dataset.tab === "summary") renderSummary();
    if (btn.dataset.tab === "list") renderList();
  });
});

// ── Currency ───────────────────────────────────────────
$("currencySelect").addEventListener("change", e => {
  currency = e.target.value;
  const isTWD = currency === "TWD";
  $("rateLabel").classList.toggle("hidden", !isTWD);
  $("rateInput").classList.toggle("hidden", !isTWD);
  $("rateUnit").classList.toggle("hidden", !isTWD);
  updateTwdPreview();
});
$("rateInput").addEventListener("input", e => {
  rate = parseFloat(e.target.value) || 0.20;
  updateTwdPreview();
});

function updateTwdPreview() {
  const v = parseFloat(formAmount.value);
  if (currency === "TWD" && v > 0) {
    twdPreview.textContent = "≈ NT$ " + Math.round(v * rate).toLocaleString();
    twdPreview.classList.remove("hidden");
  } else {
    twdPreview.classList.add("hidden");
  }
}
formAmount.addEventListener("input", updateTwdPreview);

// ── Category chips ─────────────────────────────────────
function selectCat(cat) {
  formCat = cat;
  document.querySelectorAll("[data-cat]").forEach(b => {
    b.className = "chip";
    if (b.dataset.cat === cat) b.classList.add("active-cat-"+cat);
  });
}
$("catGroup").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (b) selectCat(b.dataset.cat);
});

// ── Payment chips ──────────────────────────────────────
function selectPay(pay) {
  formPay = pay;
  document.querySelectorAll("[data-pay]").forEach(b => {
    b.className = "pay-btn";
    if (b.dataset.pay === pay) b.classList.add("active");
  });
}
$("payGroup").addEventListener("click", e => {
  const b = e.target.closest("[data-pay]");
  if (b) selectPay(b.dataset.pay);
});

// ── Save / Edit ────────────────────────────────────────
saveBtn.addEventListener("click", () => {
  const v = parseFloat(formAmount.value);
  if (!v || v <= 0) return;
  const entry = {
    id: editId ?? Date.now(),
    date: formDate.value,
    category: formCat,
    payment: formPay,
    amount: v,
    note: formNote.value.trim(),
  };
  if (editId !== null) {
    records = records.map(r => r.id === editId ? entry : r);
    exitEdit();
  } else {
    records.push(entry);
  }
  resetForm();
  saveBtn.textContent = "✓ 已儲存！";
  saveBtn.classList.add("saved");
  setTimeout(() => { saveBtn.textContent = editId !== null ? "更新記錄" : "＋ 儲存記錄"; saveBtn.classList.remove("saved"); }, 1800);
});

cancelBtn.addEventListener("click", exitEdit);

function resetForm() {
  formDate.value = today();
  formAmount.value = "";
  formNote.value = "";
  selectCat("吃喝");
  selectPay("現金");
  updateTwdPreview();
}
function exitEdit() {
  editId = null;
  editNotice.classList.add("hidden");
  cancelBtn.classList.add("hidden");
  saveBtn.textContent = "＋ 儲存記錄";
  resetForm();
}

// ── Calculator ─────────────────────────────────────────
calcToggle.addEventListener("click", e => {
  e.stopPropagation();
  calcOpen = !calcOpen;
  calcPanel.classList.toggle("hidden", !calcOpen);
  calcToggle.classList.toggle("open", calcOpen);
  if (calcOpen) { calcExpr = formAmount.value || ""; calcRes = null; calcErr = false; renderCalc(); }
});

document.addEventListener("mousedown", e => {
  if (calcOpen && !$("amountField").contains(e.target)) {
    calcOpen = false;
    calcPanel.classList.add("hidden");
    calcToggle.classList.remove("open");
  }
});

$("calcPanel").addEventListener("click", e => {
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const key = btn.dataset.key;
  calcErr = false;
  if (key === "C") { calcExpr = ""; calcRes = null; }
  else if (key === "⌫") { calcExpr = calcExpr.slice(0,-1); calcRes = null; }
  else { calcExpr += key; calcRes = null; }
  renderCalc();
});

$("calcEqualsBtn").addEventListener("click", () => {
  try {
    const s = calcExpr.replace(/[^0-9+\-*/().% ]/g,"");
    if (!s) return;
    const r = Function('"use strict";return('+s+')')();
    if (!isFinite(r)) { calcErr = true; }
    else { calcRes = Math.round(r*100)/100; }
  } catch { calcErr = true; }
  renderCalc();
});

calcApply.addEventListener("click", () => {
  if (calcRes === null || calcErr) return;
  formAmount.value = Math.round(calcRes);
  calcOpen = false;
  calcPanel.classList.add("hidden");
  calcToggle.classList.remove("open");
  calcExpr = ""; calcRes = null; calcErr = false;
  updateTwdPreview();
});

function renderCalc() {
  calcExprEl.textContent = calcExpr || "0";
  calcResEl.className = "calc-result";
  if (calcErr) { calcResEl.textContent = "錯誤"; calcResEl.classList.add("err"); }
  else if (calcRes !== null) { calcResEl.textContent = calcRes.toLocaleString(); calcResEl.classList.add("ok"); }
  else { calcResEl.textContent = ""; }
  calcApply.className = "calc-apply" + (calcRes !== null && !calcErr ? " ready" : "");
}

// ── List ───────────────────────────────────────────────
function displayAmt(r) {
  return currency === "JPY" ? r.amount : Math.round(r.amount * rate);
}
const sym = () => currency === "JPY" ? "¥" : "NT$";

function renderList() {
  const el = $("listContainer");
  if (records.length === 0) {
    el.innerHTML = '<div class="empty"><div class="emoji">🗒️</div>尚無記帳資料</div>';
    return;
  }
  const sorted = [...records].reverse();
  el.innerHTML = sorted.map(r => {
    const da = displayAmt(r);
    const col = CAT_COLORS[r.category];
    const payIcon = r.payment === "現金" ? "💴" : r.payment === "信用卡" ? "💳" : "🎴";
    const origLine = currency === "TWD" ? `<div class="record-orig">¥${r.amount.toLocaleString()}</div>` : "";
    return `<div class="record-card" style="border-left-color:${col};border-color:${col}40">
      <div style="flex:1">
        <div class="record-meta">
          <span class="record-date">${r.date}</span>
          <span class="record-cat" style="background:${col}22;color:${col}">${CAT_ICONS[r.category]} ${r.category}</span>
          <span class="record-pay">${payIcon} ${r.payment}</span>
        </div>
        ${r.note ? `<div class="record-note">${r.note}</div>` : ""}
      </div>
      <div>
        <div class="record-amount">${sym()}${da.toLocaleString()}</div>
        ${origLine}
        <div class="record-actions">
          <button class="btn-edit" onclick="startEdit(${r.id})">編輯</button>
          <button class="btn-del" onclick="deleteRecord(${r.id})">刪除</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function startEdit(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  editId = id;
  formDate.value = r.date;
  formAmount.value = r.amount;
  formNote.value = r.note;
  selectCat(r.category);
  selectPay(r.payment);
  editNotice.classList.remove("hidden");
  cancelBtn.classList.remove("hidden");
  saveBtn.textContent = "更新記錄";
  // Switch to record tab
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-tab="record"]').classList.add("active");
  ["record","list","summary"].forEach(t => $("tab-"+t).classList.add("hidden"));
  $("tab-record").classList.remove("hidden");
  window.scrollTo(0,0);
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  if (editId === id) exitEdit();
  renderList();
}

// ── Summary ────────────────────────────────────────────
function renderSummary() {
  const totCat = {};
  CATEGORIES.forEach(c => totCat[c] = 0);
  records.forEach(r => totCat[r.category] += displayAmt(r));
  const grand = Object.values(totCat).reduce((a,b)=>a+b,0);
  const cash  = records.filter(r=>r.payment==="現金").reduce((s,r)=>s+displayAmt(r),0);
  const card  = records.filter(r=>r.payment==="信用卡").reduce((s,r)=>s+displayAmt(r),0);

  $("grandTotal").textContent = sym() + grand.toLocaleString();

  // Pie
  renderPie(CATEGORIES.map(c=>({value:totCat[c],color:CAT_COLORS[c]})), grand);

  // Category
  $("catBreakdown").innerHTML = CATEGORIES.map(c => {
    const val = totCat[c];
    const pct = grand > 0 ? (val/grand*100).toFixed(1) : "0.0";
    return `<div class="cat-row">
      <div class="cat-row-top">
        <span class="cat-name" style="color:${CAT_COLORS[c]}">${CAT_ICONS[c]} ${c}</span>
        <div><span class="cat-val">${sym()}${val.toLocaleString()}</span><span class="cat-pct">${pct}%</span></div>
      </div>
      <div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${CAT_COLORS[c]}"></div></div>
    </div>`;
  }).join("");

  // Payment
  const payItems = [
    {label:"💴 現金支出", value:cash, color:"#80d080"},
    {label:"💳 信用卡刷卡", value:card, color:"#80a0ff"},
  ];
  $("payBreakdown").innerHTML = payItems.map(p => {
    const pct = grand > 0 ? (p.value/grand*100).toFixed(1) : "0.0";
    return `<div class="pay-card" style="border:1px solid ${p.color}30">
      <div class="pay-card-label">${p.label}</div>
      <div class="pay-card-val" style="color:${p.color}">${sym()}${p.value.toLocaleString()}</div>
      <div class="pay-card-pct">${pct}%</div>
    </div>`;
  }).join("");
}

function renderPie(data, total) {
  const svg = $("pieChart");
  if (total === 0) {
    svg.innerHTML = `<text x="100" y="104" text-anchor="middle" fill="#888" font-size="12" font-family="'Noto Sans TC',sans-serif">尚無資料</text>`;
    return;
  }
  let angle = -Math.PI/2;
  let paths = "";
  data.forEach(d => {
    if (!d.value) return;
    const a = d.value/total * 2*Math.PI;
    const x1 = 100 + 80*Math.cos(angle), y1 = 100 + 80*Math.sin(angle);
    const x2 = 100 + 80*Math.cos(angle+a), y2 = 100 + 80*Math.sin(angle+a);
    const large = a > Math.PI ? 1 : 0;
    paths += `<path d="M 100 100 L ${x1} ${y1} A 80 80 0 ${large} 1 ${x2} ${y2} Z" fill="${d.color}" opacity="0.9" stroke="#1a1a2e" stroke-width="1.5"/>`;
    angle += a;
  });
  svg.innerHTML = paths
    + `<circle cx="100" cy="100" r="38" fill="#1a1a2e"/>`
    + `<text x="100" y="96" text-anchor="middle" fill="#fff" font-size="10" font-family="'Noto Sans TC',sans-serif">總花費</text>`
    + `<text x="100" y="112" text-anchor="middle" fill="#f0c040" font-size="9" font-family="monospace">${total.toLocaleString()}</text>`;
}
</script>
</body>
</html>
