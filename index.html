<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名古屋旅遊記帳</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%23fff'/%3E%3Crect x='10' y='14' width='80' height='10' rx='3' fill='%23DC5032'/%3E%3Crect x='16' y='10' width='68' height='7' rx='2' fill='%23DC5032'/%3E%3Crect x='18' y='30' width='64' height='8' rx='2' fill='%23DC5032'/%3E%3Crect x='24' y='24' width='10' height='62' rx='2' fill='%23644646'/%3E%3Crect x='66' y='24' width='10' height='62' rx='2' fill='%23644646'/%3E%3Crect x='34' y='45' width='32' height='5' rx='1.5' fill='%23C88C28'/%3E%3C/svg%3E">

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f0eb; color: #2c2420; font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 60px; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #fff8f0 0%, #fdeede 100%);
    border-bottom: 1px solid #e8d8c8; padding: 24px 20px 16px;
    position: relative; overflow: hidden; box-shadow: 0 2px 12px #c8a88018;
  }
  .header::before {
    content: ''; position: absolute; top: -30px; right: -20px;
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, #DC503218 0%, transparent 70%);
  }
  .header-title { display: flex; align-items: center; gap: 12px; margin-bottom: 2px; }
  .header-title .emoji { font-size: 26px; }
  .header-title h1 { font-size: 19px; font-weight: 700; letter-spacing: 2px; color: #2c2420; }
  .header-subtitle { font-size: 10px; color: #a08070; letter-spacing: 1.5px; margin-left: 38px; }
  .currency-bar { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .currency-bar label { font-size: 11px; color: #a08070; letter-spacing: 1px; }
  .backup-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .backup-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-family: inherit; cursor: pointer; letter-spacing: 0.5px; transition: all 0.15s; }
  .btn-export { background: #e8f0fc; color: #4070c0; border: 1px solid #c0d4f0; }
  .btn-import { background: #e8f5ec; color: #408050; border: 1px solid #b8dcc0; }
  .btn-sync   { background: #fff4e8; color: #c07020; border: 1px solid #f0d0a0; }
  .btn-sync.syncing { opacity: 0.6; pointer-events: none; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid #e0c8b0; border-radius: 10px; color: #604030; padding: 10px 20px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 20px #00000018; }
  .toast.show { opacity: 1; }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid #e0d0c0; background: #fff; }
  .tab-btn { flex: 1; padding: 13px 0; background: none; border: none; border-bottom: 2px solid transparent; color: #b09080; font-size: 13px; letter-spacing: 1px; transition: all 0.2s; }
  .tab-btn.active { border-bottom-color: #DC5032; color: #DC5032; font-weight: 700; }

  .content { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* Form */
  .form-section { padding-top: 22px; display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: 10px; letter-spacing: 2px; color: #a08878; text-transform: uppercase; margin-bottom: 6px; font-weight: 500; }
  .input-base { background: #fff; border: 1px solid #e0cfc0; border-radius: 10px; color: #2c2420; padding: 10px 14px; font-size: 15px; width: 100%; outline: none; font-family: inherit; box-shadow: 0 1px 4px #00000008; }
  .input-base:focus { border-color: #DC5032; box-shadow: 0 0 0 3px #DC503212; }

  /* Chips */
  .chip-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 13px; border-radius: 20px; border: 1.5px solid #e0cfc0; background: #fff; color: #a08878; font-size: 13px; transition: all 0.15s; }
  .chip.active-cat-吃喝    { border-color: #E8603C; background: #E8603C15; color: #C84820; }
  .chip.active-cat-住宿    { border-color: #3C7BE8; background: #3C7BE815; color: #2060C8; }
  .chip.active-cat-交通    { border-color: #2aaa60; background: #2aaa6015; color: #208048; }
  .chip.active-cat-送禮    { border-color: #b040d0; background: #b040d015; color: #9030b0; }
  .chip.active-cat-衣      { border-color: #e05090; background: #e0509015; color: #b03070; }
  .chip.active-cat-觀光    { border-color: #e08020; background: #e0802015; color: #a05810; }
  .chip.active-cat-IC卡儲值{ border-color: #20a0b0; background: #20a0b015; color: #107888; }
  .chip.active-cat-其他    { border-color: #c09020; background: #c0902015; color: #906800; }

  .pay-group { display: flex; gap: 8px; }
  .pay-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1.5px solid #e0cfc0; background: #fff; color: #a08878; font-size: 13px; transition: all 0.15s; box-shadow: 0 1px 4px #00000008; }
  .pay-btn.active { border-color: #DC5032; background: #DC503210; color: #C04020; font-weight: 500; }

  /* Amount */
  .amount-row { display: flex; gap: 8px; }
  .amount-wrap { position: relative; flex: 1; }
  .amount-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #C88C28; font-weight: 700; pointer-events: none; }
  .amount-input { padding-left: 30px !important; }
  .calc-toggle-btn { background: #fff; border: 1.5px solid #e0cfc0; border-radius: 10px; color: #a08878; font-size: 18px; width: 44px; flex-shrink: 0; transition: all 0.15s; box-shadow: 0 1px 4px #00000008; }
  .calc-toggle-btn.open { background: #fff8f0; border-color: #DC5032; color: #DC5032; }
  .twd-preview { font-size: 12px; color: #408050; margin-top: 6px; padding-left: 2px; }

  /* Calculator */
  .calc-panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 100; background: #fff; border: 1.5px solid #e0cfc0; border-radius: 14px; padding: 14px; box-shadow: 0 8px 40px #00000018; }
  .calc-display { background: #faf6f2; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end; border: 1px solid #e8d8c8; }
  .calc-expr { font-size: 12px; color: #b09080; word-break: break-all; text-align: right; min-height: 18px; }
  .calc-result { font-size: 22px; font-weight: 700; font-family: monospace; color: #2c2420; margin-top: 2px; }
  .calc-result.ok  { color: #307848; }
  .calc-result.err { color: #c03020; }
  .calc-keys { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 6px; }
  .calc-key, .calc-equals, .calc-apply, .calc-toggle-btn {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .calc-key { padding: 12px 0; border-radius: 8px; border: none; font-size: 16px; font-family: monospace; transition: background 0.1s; background: #f5f0eb; color: #2c2420; }
  .calc-key.op  { background: #fdeede; color: #904020; font-weight: 700; }
  .calc-key.del { background: #fce8e4; color: #b03020; }
  .calc-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .calc-equals { padding: 13px 0; border-radius: 8px; border: none; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #DC5032, #f07040); color: #fff; }
  .calc-apply  { padding: 13px 0; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; letter-spacing: 1px; background: #f0ece8; color: #c0a898; transition: all 0.2s; }
  .calc-apply.ready { background: linear-gradient(135deg, #308050, #40a068); color: #fff; cursor: pointer; }

  /* Save */
  .save-btn { background: linear-gradient(135deg, #DC5032, #f07040); border: none; border-radius: 12px; color: #fff; font-size: 15px; padding: 14px; font-weight: 700; letter-spacing: 2px; transition: all 0.3s; width: 100%; box-shadow: 0 3px 12px #DC503228; }
  .save-btn.saved { background: linear-gradient(135deg, #308050, #40a068); box-shadow: 0 3px 12px #30805028; }
  .cancel-btn { background: none; border: 1px solid #e0cfc0; border-radius: 12px; color: #a08878; font-size: 13px; padding: 10px; width: 100%; }
  .edit-notice { background: #fff8e8; border: 1px solid #e0c070; border-radius: 8px; padding: 10px 14px; font-size: 13px; color: #806020; }

  /* List */
  .list-section { padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; color: #c0a898; padding: 60px 0; font-size: 14px; }
  .empty .emoji { font-size: 40px; margin-bottom: 12px; }
  .record-card { background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border: 1px solid #e8d8c8; border-left-width: 3px; box-shadow: 0 1px 6px #00000008; }
  .record-meta { display: flex; gap: 7px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .record-date   { font-size: 11px; color: #b09080; }
  .record-cat    { border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: 500; }
  .record-pay    { font-size: 11px; color: #a08878; background: #f5f0eb; border-radius: 8px; padding: 2px 7px; }
  .record-note   { font-size: 12px; color: #a09080; margin-bottom: 2px; }
  .record-amount { font-size: 16px; font-weight: 700; color: #904020; font-family: monospace; text-align: right; }
  .record-orig   { font-size: 11px; color: #c0a898; text-align: right; }
  .record-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
  .btn-edit { background: #eef2fc; border: none; border-radius: 6px; color: #5070c0; font-size: 11px; padding: 4px 8px; }
  .btn-del  { background: #fceae8; border: none; border-radius: 6px; color: #c05040; font-size: 11px; padding: 4px 8px; }

  /* Summary */
  .summary-section { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: #fff; border: 1px solid #e8d8c8; border-radius: 14px; padding: 18px; box-shadow: 0 1px 8px #00000008; }
  .card-title { font-size: 11px; color: #a08878; letter-spacing: 2px; margin-bottom: 14px; font-weight: 500; text-transform: uppercase; }
  .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .grand-label  { font-size: 11px; color: #a08878; letter-spacing: 2px; margin-bottom: 4px; text-align: center; }
  .grand-amount { font-size: 28px; font-weight: 700; color: #904020; font-family: monospace; text-align: center; }
  .cat-row { margin-bottom: 12px; }
  .cat-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .cat-name { font-size: 13px; }
  .cat-val  { font-family: monospace; color: #2c2420; font-size: 14px; font-weight: 700; }
  .cat-pct  { color: #b09080; font-size: 11px; margin-left: 8px; }
  .cat-bar-bg { height: 5px; background: #f0e8e0; border-radius: 3px; overflow: hidden; }
  .cat-bar    { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .pay-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  .pay-card { background: #faf6f2; border-radius: 10px; padding: 14px; border: 1px solid #e8d8c8; }
  .pay-card-label { font-size: 11px; color: #a08878; margin-bottom: 6px; }
  .pay-card-val   { font-family: monospace; font-size: 18px; font-weight: 700; }
  .pay-card-pct   { font-size: 10px; color: #c0a898; margin-top: 4px; }
  .ic-note { margin-top: 12px; font-size: 11px; color: #b09878; line-height: 1.6; padding: 8px 10px; background: #faf6f0; border-radius: 8px; border: 1px solid #e8d8b8; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <span class="emoji">⛩️</span>
    <h1>名古屋旅遊記帳</h1>
  </div>
  <div class="header-subtitle">NAGOYA TRAVEL EXPENSE TRACKER</div>
  <div class="currency-bar">
    <label>幣別</label>
    <select id="currencySelect" class="input-base" style="width:auto;padding:6px 10px;font-size:13px">
      <option value="JPY">🇯🇵 日元（¥）</option>
      <option value="TWD">🇹🇼 新台幣（NT$）</option>
    </select>
    <span id="rateLabel" class="hidden" style="font-size:11px;color:#a08070">匯率</span>
    <input id="rateInput" type="number" value="0.20" step="0.01" class="input-base hidden" style="width:80px;padding:6px 10px;font-size:13px">
    <span id="rateUnit" class="hidden" style="font-size:11px;color:#a08070">¥1 = NT$</span>
  </div>
  <div class="backup-bar">
    <button class="backup-btn btn-sync" id="syncUpBtn"   onclick="syncUp()">☁️ 上傳雲端</button>
    <button class="backup-btn btn-sync" id="syncDownBtn" onclick="syncDown()">🔄 同步資料</button>
    <button class="backup-btn btn-export" onclick="exportData()">📤 匯出備份</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="record">✏️ 記帳</button>
  <button class="tab-btn" data-tab="list">📋 明細</button>
  <button class="tab-btn" data-tab="summary">📊 統計</button>
</div>

<div class="content">

  <!-- RECORD -->
  <div id="tab-record" class="form-section">
    <div id="editNotice" class="edit-notice hidden">✏️ 編輯模式 — 修改後請點「更新」</div>

    <div class="field">
      <label>日期</label>
      <input type="date" id="formDate" class="input-base">
    </div>

    <div class="field">
      <label>花費分類</label>
      <div class="chip-group" id="catGroup">
        <button class="chip" data-cat="吃喝">🍜 吃喝</button>
        <button class="chip" data-cat="住宿">🏨 住宿</button>
        <button class="chip" data-cat="交通">🚅 交通</button>
        <button class="chip" data-cat="送禮">🎁 送禮</button>
        <button class="chip" data-cat="衣">👕 衣</button>
        <button class="chip" data-cat="觀光">🎡 觀光</button>
        <button class="chip" data-cat="IC卡儲值">🎴 IC卡儲值</button>
        <button class="chip" data-cat="其他">📦 其他</button>
      </div>
    </div>

    <div class="field">
      <label>付款方式</label>
      <div class="pay-group" id="payGroup">
        <button class="pay-btn" data-pay="現金">💴 現金</button>
        <button class="pay-btn" data-pay="信用卡">💳 信用卡</button>
        <button class="pay-btn" data-pay="IC卡">🎴 IC卡</button>
      </div>
    </div>

    <div class="field" style="position:relative" id="amountField">
      <label>金額（¥ 日元）</label>
      <div class="amount-row">
        <div class="amount-wrap">
          <span class="amount-prefix">¥</span>
          <input type="number" id="formAmount" class="input-base amount-input" placeholder="0">
        </div>
        <button class="calc-toggle-btn" id="calcToggleBtn" title="開啟計算機">🧮</button>
      </div>
      <div id="twdPreview" class="twd-preview hidden"></div>
      <div class="calc-panel hidden" id="calcPanel">
        <div class="calc-display">
          <div class="calc-expr" id="calcExpr">0</div>
          <div class="calc-result" id="calcResult"></div>
        </div>
        <div class="calc-keys">
          <button class="calc-key del" data-key="C">C</button>
          <button class="calc-key del" data-key="⌫">⌫</button>
          <button class="calc-key op"  data-key="(">(</button>
          <button class="calc-key op"  data-key=")">)</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="7">7</button>
          <button class="calc-key" data-key="8">8</button>
          <button class="calc-key" data-key="9">9</button>
          <button class="calc-key op" data-key="/">÷</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="4">4</button>
          <button class="calc-key" data-key="5">5</button>
          <button class="calc-key" data-key="6">6</button>
          <button class="calc-key op" data-key="*">×</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="1">1</button>
          <button class="calc-key" data-key="2">2</button>
          <button class="calc-key" data-key="3">3</button>
          <button class="calc-key op" data-key="-">−</button>
        </div>
        <div class="calc-keys">
          <button class="calc-key" data-key="0">0</button>
          <button class="calc-key" data-key=".">.</button>
          <button class="calc-key op" data-key="%">%</button>
          <button class="calc-key op" data-key="+">+</button>
        </div>
        <div class="calc-bottom">
          <button class="calc-equals" id="calcEqualsBtn">=</button>
          <button class="calc-apply"  id="calcApplyBtn">套用金額</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>備註</label>
      <input type="text" id="formNote" class="input-base" placeholder="可選填…">
    </div>

    <button class="save-btn" id="saveBtn">＋ 儲存記錄</button>
    <button class="cancel-btn hidden" id="cancelEditBtn">取消編輯</button>
  </div>

  <!-- LIST -->
  <div id="tab-list" class="hidden">
    <div class="list-section" id="listContainer">
      <div class="empty"><div class="emoji">🗒️</div>尚無記帳資料</div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div id="tab-summary" class="hidden">
    <div class="summary-section">
      <div class="card pie-wrap">
        <svg id="pieChart" viewBox="0 0 200 200" width="200" height="200">
          <text x="100" y="104" text-anchor="middle" fill="#c0a898" font-size="12" font-family="'Noto Sans TC',sans-serif">尚無資料</text>
        </svg>
        <div><div class="grand-label">總花費</div><div class="grand-amount" id="grandTotal">¥0</div></div>
      </div>
      <div class="card"><div class="card-title">花費分類統計</div><div id="catBreakdown"></div></div>
      <div class="card">
        <div class="card-title">付款方式統計</div>
        <div class="pay-grid" id="payBreakdown"></div>
      </div>
      <div class="card" id="icCard" style="display:none">
        <div class="card-title">🎴 IC卡消費明細</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #e8d8c8">
          <span style="font-size:12px;color:#a08878">IC卡消費總計</span>
          <span id="icTotal" style="font-size:22px;font-weight:700;font-family:monospace;color:#20a0b0"></span>
        </div>
        <div id="icBreakdown"></div>
      </div>
    </div>
  </div>

</div>

<script>
const CATEGORIES  = ["吃喝","住宿","交通","送禮","衣","觀光","IC卡儲值","其他"];
const CAT_COLORS  = { 吃喝:"#E8603C", 住宿:"#3C7BE8", 交通:"#2aaa60", 送禮:"#b040d0", 衣:"#e05090", 觀光:"#e08020", IC卡儲值:"#20a0b0", 其他:"#c09020" };
const CAT_ICONS   = { 吃喝:"🍜", 住宿:"🏨", 交通:"🚅", 送禮:"🎁", 衣:"👕", 觀光:"🎡", IC卡儲值:"🎴", 其他:"📦" };
const STORAGE_KEY = "nagoya_tracker_v1";

let records=[], currency="JPY", rate=0.20, editId=null, formCat="吃喝", formPay="現金";
let calcExpr="", calcRes=null, calcErr=false, calcOpen=false;
const today = () => new Date().toISOString().slice(0,10);
const $ = id => document.getElementById(id);

const formDate=$("formDate"), formAmount=$("formAmount"), formNote=$("formNote");
const saveBtn=$("saveBtn"), cancelBtn=$("cancelEditBtn"), editNotice=$("editNotice");
const twdPreview=$("twdPreview"), calcPanel=$("calcPanel"), calcToggle=$("calcToggleBtn");
const calcExprEl=$("calcExpr"), calcResEl=$("calcResult"), calcApply=$("calcApplyBtn");

// Persist
function saveToStorage() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({records,currency,rate})); } catch(e){} }
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.records)) records = d.records;
    if (d.currency) { currency = d.currency; $("currencySelect").value = currency; const t=currency==="TWD"; $("rateLabel").classList.toggle("hidden",!t); $("rateInput").classList.toggle("hidden",!t); $("rateUnit").classList.toggle("hidden",!t); }
    if (d.rate) { rate = d.rate; $("rateInput").value = rate; }
  } catch(e){}
}

// Toast
let toastTimer;
function showToast(msg, isError) {
  const t=$("toast"); t.textContent=msg; t.style.borderColor=isError?"#e09080":"#e0c8b0"; t.style.color=isError?"#903020":"#604030";
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2500);
}

// Export / Import
function exportData() {
  if (!records.length) { showToast("⚠️ 尚無資料可匯出",true); return; }
  const blob=new Blob([JSON.stringify({records,currency,rate},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`名古屋記帳_${today()}.json`; a.click(); URL.revokeObjectURL(url);
  showToast("✅ 已匯出備份檔案");
}
// Google Apps Script 同步
const GAS_URL = "https://script.google.com/macros/s/AKfycbzSxWsC4iK09dgwcFdcTgPLqYhRfoemZ7bpAO1YSAPgi7Udd23MByUtkNB_x13HUxw/exec";

async function syncUp() {
  const btn = $("syncUpBtn");
  btn.classList.add("syncing"); btn.textContent = "☁️ 上傳中…";
  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ action: "save", records }),
    });
    const data = await res.json();
    if (data.success) showToast(`☁️ 已上傳 ${data.count} 筆資料至雲端`);
    else showToast("❌ 上傳失敗：" + (data.error||"未知錯誤"), true);
  } catch(e) {
    showToast("❌ 網路錯誤，請稍後再試", true);
  }
  btn.classList.remove("syncing"); btn.textContent = "☁️ 上傳雲端";
}

async function syncDown() {
  const btn = $("syncDownBtn");
  btn.classList.add("syncing"); btn.textContent = "🔄 同步中…";
  try {
    const res  = await fetch(GAS_URL + "?action=load");
    const data = await res.json();
    if (data.records) {
      if (records.length > 0 && !confirm(`同步將以雲端資料覆蓋本機 ${records.length} 筆記錄，確定嗎？`)) {
        btn.classList.remove("syncing"); btn.textContent = "🔄 同步資料"; return;
      }
      records = data.records;
      saveToStorage();
      showToast(`✅ 已同步 ${records.length} 筆資料`);
      // 若目前在明細或統計頁則重新渲染
      if (!$("tab-list").classList.contains("hidden"))    renderList();
      if (!$("tab-summary").classList.contains("hidden")) renderSummary();
    } else {
      showToast("❌ 同步失敗：" + (data.error||"未知錯誤"), true);
    }
  } catch(e) {
    showToast("❌ 網路錯誤，請稍後再試", true);
  }
  btn.classList.remove("syncing"); btn.textContent = "🔄 同步資料";
}
loadFromStorage(); formDate.value=today(); selectCat("吃喝"); selectPay("現金");

// Tabs
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); btn.classList.add("active");
    ["record","list","summary"].forEach(t=>$("tab-"+t).classList.add("hidden")); $("tab-"+btn.dataset.tab).classList.remove("hidden");
    if (btn.dataset.tab==="summary") renderSummary();
    if (btn.dataset.tab==="list") renderList();
  });
});

// Currency
$("currencySelect").addEventListener("change",e=>{ currency=e.target.value; const t=currency==="TWD"; $("rateLabel").classList.toggle("hidden",!t); $("rateInput").classList.toggle("hidden",!t); $("rateUnit").classList.toggle("hidden",!t); updateTwdPreview(); saveToStorage(); });
$("rateInput").addEventListener("input",e=>{ rate=parseFloat(e.target.value)||0.20; updateTwdPreview(); saveToStorage(); });
function updateTwdPreview() { const v=parseFloat(formAmount.value); if(currency==="TWD"&&v>0){twdPreview.textContent="≈ NT$ "+Math.round(v*rate).toLocaleString(); twdPreview.classList.remove("hidden");}else{twdPreview.classList.add("hidden");} }
formAmount.addEventListener("input",updateTwdPreview);

// Category
function selectCat(cat) {
  formCat=cat;
  document.querySelectorAll("[data-cat]").forEach(b=>{ b.className="chip"; if(b.dataset.cat===cat) b.classList.add("active-cat-"+cat.replace(/\s/g,"")); });
}
$("catGroup").addEventListener("click",e=>{ const b=e.target.closest("[data-cat]"); if(b) selectCat(b.dataset.cat); });

// Payment
function selectPay(pay) { formPay=pay; document.querySelectorAll("[data-pay]").forEach(b=>{ b.className="pay-btn"; if(b.dataset.pay===pay) b.classList.add("active"); }); }
$("payGroup").addEventListener("click",e=>{ const b=e.target.closest("[data-pay]"); if(b) selectPay(b.dataset.pay); });

// Save
saveBtn.addEventListener("click",()=>{
  const v=parseFloat(formAmount.value); if(!v||v<=0) return;
  const entry={id:editId??Date.now(), date:formDate.value, category:formCat, payment:formPay, amount:v, note:formNote.value.trim()};
  if(editId!==null){ records=records.map(r=>r.id===editId?entry:r); exitEdit(); } else { records.push(entry); }
  resetForm(); saveToStorage(); saveBtn.textContent="✓ 已儲存！"; saveBtn.classList.add("saved");
  setTimeout(()=>{ saveBtn.textContent="＋ 儲存記錄"; saveBtn.classList.remove("saved"); },1800);
});
cancelBtn.addEventListener("click",exitEdit);
function resetForm(){ formDate.value=today(); formAmount.value=""; formNote.value=""; selectCat("吃喝"); selectPay("現金"); updateTwdPreview(); }
function exitEdit(){ editId=null; editNotice.classList.add("hidden"); cancelBtn.classList.add("hidden"); saveBtn.textContent="＋ 儲存記錄"; resetForm(); }

// Calculator — 用 fastClick 解決 iOS 300ms 延遲
function fastClick(el, fn) {
  let moved = false;
  el.addEventListener("touchstart", e => { moved=false; }, {passive:true});
  el.addEventListener("touchmove",  () => { moved=true;  }, {passive:true});
  el.addEventListener("touchend",   e => {
    if (moved) return;
    e.preventDefault(); // 阻止後續 click 事件觸發
    fn(e);
  });
  el.addEventListener("click", fn); // 桌機 fallback
}

fastClick(calcToggle, e => {
  e.stopPropagation(); calcOpen=!calcOpen;
  calcPanel.classList.toggle("hidden",!calcOpen);
  calcToggle.classList.toggle("open",calcOpen);
  if(calcOpen){calcExpr=formAmount.value||""; calcRes=null; calcErr=false; renderCalc();}
});

document.addEventListener("touchstart", e=>{ if(calcOpen&&!$("amountField").contains(e.target)){calcOpen=false; calcPanel.classList.add("hidden"); calcToggle.classList.remove("open");} }, {passive:true});
document.addEventListener("mousedown",  e=>{ if(calcOpen&&!$("amountField").contains(e.target)){calcOpen=false; calcPanel.classList.add("hidden"); calcToggle.classList.remove("open");} });

fastClick($("calcPanel"), e=>{
  const btn=e.target.closest("[data-key]"); if(!btn) return;
  const key=btn.dataset.key; calcErr=false;
  if(key==="C"){calcExpr="";calcRes=null;}
  else if(key==="⌫"){calcExpr=calcExpr.slice(0,-1);calcRes=null;}
  else{calcExpr+=key;calcRes=null;}
  renderCalc();
});

fastClick($("calcEqualsBtn"), ()=>{
  try{
    const s=calcExpr.replace(/[^0-9+\-*/().% ]/g,""); if(!s) return;
    const r=Function('"use strict";return('+s+')')();
    if(!isFinite(r)){calcErr=true;}else{calcRes=Math.round(r*100)/100;}
  }catch{calcErr=true;}
  renderCalc();
});

fastClick(calcApply, ()=>{
  if(calcRes===null||calcErr) return;
  formAmount.value=Math.round(calcRes); calcOpen=false;
  calcPanel.classList.add("hidden"); calcToggle.classList.remove("open");
  calcExpr=""; calcRes=null; calcErr=false; updateTwdPreview();
});

function renderCalc(){
  calcExprEl.textContent=calcExpr||"0";
  calcResEl.className="calc-result";
  if(calcErr){calcResEl.textContent="錯誤";calcResEl.classList.add("err");}
  else if(calcRes!==null){calcResEl.textContent=calcRes.toLocaleString();calcResEl.classList.add("ok");}
  else{calcResEl.textContent="";}
  calcApply.className="calc-apply"+(calcRes!==null&&!calcErr?" ready":"");
}

// List
function displayAmt(r){ return currency==="JPY"?r.amount:Math.round(r.amount*rate); }
const sym=()=>currency==="JPY"?"¥":"NT$";
function renderList(){
  const el=$("listContainer");
  if(!records.length){ el.innerHTML='<div class="empty"><div class="emoji">🗒️</div>尚無記帳資料</div>'; return; }
  el.innerHTML=[...records].reverse().map(r=>{
    const da=displayAmt(r), col=CAT_COLORS[r.category]||"#a08878";
    const payIcon=r.payment==="現金"?"💴":r.payment==="信用卡"?"💳":"🎴";
    const orig=currency==="TWD"?`<div class="record-orig">¥${r.amount.toLocaleString()}</div>`:"";
    return `<div class="record-card" style="border-left-color:${col};border-color:${col}40">
      <div style="flex:1"><div class="record-meta"><span class="record-date">${r.date}</span><span class="record-cat" style="background:${col}18;color:${col}">${CAT_ICONS[r.category]||"📦"} ${r.category}</span><span class="record-pay">${payIcon} ${r.payment}</span></div>${r.note?`<div class="record-note">${r.note}</div>`:""}</div>
      <div><div class="record-amount">${sym()}${da.toLocaleString()}</div>${orig}<div class="record-actions"><button class="btn-edit" onclick="startEdit(${r.id})">編輯</button><button class="btn-del" onclick="deleteRecord(${r.id})">刪除</button></div></div>
    </div>`;
  }).join("");
}
function startEdit(id){
  const r=records.find(x=>x.id===id); if(!r) return;
  editId=id; formDate.value=r.date; formAmount.value=r.amount; formNote.value=r.note; selectCat(r.category); selectPay(r.payment);
  editNotice.classList.remove("hidden"); cancelBtn.classList.remove("hidden"); saveBtn.textContent="更新記錄";
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active")); document.querySelector('[data-tab="record"]').classList.add("active");
  ["record","list","summary"].forEach(t=>$("tab-"+t).classList.add("hidden")); $("tab-record").classList.remove("hidden"); window.scrollTo(0,0);
}
function deleteRecord(id){ records=records.filter(r=>r.id!==id); if(editId===id) exitEdit(); saveToStorage(); renderList(); }

// Summary
function renderSummary(){
  const totCat={}; CATEGORIES.forEach(c=>totCat[c]=0);
  records.forEach(r=>{ if(totCat[r.category]!==undefined) totCat[r.category]+=displayAmt(r); });

  const cash =records.filter(r=>r.payment==="現金").reduce((s,r)=>s+displayAmt(r),0);
  const card =records.filter(r=>r.payment==="信用卡").reduce((s,r)=>s+displayAmt(r),0);
  const ic   =records.filter(r=>r.payment==="IC卡").reduce((s,r)=>s+displayAmt(r),0);

  // 總花費 = 現金 + 信用卡（IC卡消費不重複計算，儲值時已算入現金）
  const grand = cash + card;

  $("grandTotal").textContent=sym()+grand.toLocaleString();

  // 圓餅圖與分類統計只算現金＋信用卡的記錄
  const totCatReal={};
  CATEGORIES.forEach(c=>totCatReal[c]=0);
  records.filter(r=>r.payment!=="IC卡").forEach(r=>{
    if(totCatReal[r.category]!==undefined) totCatReal[r.category]+=displayAmt(r);
  });

  renderPie(CATEGORIES.map(c=>({value:totCatReal[c],color:CAT_COLORS[c]})),grand);

  $("catBreakdown").innerHTML=CATEGORIES.map(c=>{
    const val=totCatReal[c], pct=grand>0?(val/grand*100).toFixed(1):"0.0";
    return `<div class="cat-row"><div class="cat-row-top"><span class="cat-name" style="color:${CAT_COLORS[c]}">${CAT_ICONS[c]} ${c}</span><div><span class="cat-val">${sym()}${val.toLocaleString()}</span><span class="cat-pct">${pct}%</span></div></div><div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${CAT_COLORS[c]}"></div></div></div>`;
  }).join("");

  $("payBreakdown").innerHTML=[
    {label:"💴 現金支出", value:cash, color:"#307848"},
    {label:"💳 信用卡刷卡", value:card, color:"#3060c0"},
    {label:"🎴 IC卡消費",  value:ic,   color:"#20a0b0"},
  ].map(p=>{
    const base=grand+ic; // 付款方式佔比以三者合計為基準
    const pct=base>0?(p.value/base*100).toFixed(1):"0.0";
    return `<div class="pay-card"><div class="pay-card-label">${p.label}</div><div class="pay-card-val" style="color:${p.color}">${sym()}${p.value.toLocaleString()}</div><div class="pay-card-pct">${pct}%</div></div>`;
  }).join("");

  // IC卡消費明細（依消費類別，排除儲值）
  const icRecs=records.filter(r=>r.payment==="IC卡");
  const icCard=$("icCard");
  if(!icRecs.length){ icCard.style.display="none"; return; }
  icCard.style.display="block";
  $("icTotal").textContent=sym()+ic.toLocaleString();

  const icCat={};
  icRecs.forEach(r=>{ if(r.category==="IC卡儲值") return; icCat[r.category]=(icCat[r.category]||0)+displayAmt(r); });
  const icSpend=Object.values(icCat).reduce((a,b)=>a+b,0);

  $("icBreakdown").innerHTML=Object.entries(icCat).sort((a,b)=>b[1]-a[1]).map(([cat,val])=>{
    const col=CAT_COLORS[cat]||"#a08878";
    const pct=icSpend>0?(val/icSpend*100).toFixed(1):"0.0";
    return `<div class="cat-row"><div class="cat-row-top"><span class="cat-name" style="color:${col}">${CAT_ICONS[cat]||"📦"} ${cat}</span><div><span class="cat-val">${sym()}${val.toLocaleString()}</span><span class="cat-pct">${pct}%</span></div></div><div class="cat-bar-bg"><div class="cat-bar" style="width:${pct}%;background:${col}"></div></div></div>`;
  }).join("")||`<div style="font-size:13px;color:#b09080;text-align:center;padding:12px 0">所有IC卡記錄皆為儲值</div>`;
}
function renderPie(data,total){
  const svg=$("pieChart");
  if(!total){ svg.innerHTML=`<text x="100" y="104" text-anchor="middle" fill="#c0a898" font-size="12" font-family="'Noto Sans TC',sans-serif">尚無資料</text>`; return; }
  let angle=-Math.PI/2, paths="";
  data.forEach(d=>{ if(!d.value) return; const a=d.value/total*2*Math.PI, x1=100+80*Math.cos(angle), y1=100+80*Math.sin(angle), x2=100+80*Math.cos(angle+a), y2=100+80*Math.sin(angle+a); paths+=`<path d="M 100 100 L ${x1} ${y1} A 80 80 0 ${a>Math.PI?1:0} 1 ${x2} ${y2} Z" fill="${d.color}" opacity="0.85" stroke="#fff" stroke-width="1.5"/>`; angle+=a; });
  svg.innerHTML=paths+`<circle cx="100" cy="100" r="38" fill="#fff"/><text x="100" y="96" text-anchor="middle" fill="#a08878" font-size="10" font-family="'Noto Sans TC',sans-serif">總花費</text><text x="100" y="112" text-anchor="middle" fill="#904020" font-size="9" font-family="monospace">${total.toLocaleString()}</text>`;
}
</script>
</body>
</html>
